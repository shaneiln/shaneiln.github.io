<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex, nofollow">
<title>RSVP · Marta &amp; Shaneil</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Antonio:wght@200&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css?v=4"></head>
<body><div class="page">
<header><a class="back" href="../">Back</a><h1>RSVP</h1></header>
<p>Please reply by <span class="todo">RSVP deadline TBC</span>.</p>
<form id="rsvp" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
<label for="name">Your name</label><input id="name" name="name" required autocomplete="name">
<label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email">
<label for="attending">Will you attend?</label>
<select id="attending" name="attending" required><option value="">Choose one</option><option>Yes, we’ll be there</option><option>No, we can’t make it</option></select>
<label for="guests">Names of everyone in your party attending</label><textarea id="guests" name="party"></textarea>
<label for="diet">Dietary requirements</label><textarea id="diet" name="dietary"></textarea>
<label for="note">Message for us (optional)</label><textarea id="note" name="message"></textarea>
<input type="text" name="_gotcha" tabindex="-1" autocomplete="off" style="display:none">
<button class="btn" type="submit">Send RSVP</button>
<p id="status" class="msg" role="status"></p>
</form>
</div>
<script>
const f=document.getElementById("rsvp"),s=document.getElementById("status");
f.addEventListener("submit",async e=>{e.preventDefault();s.textContent="Sending…";
 try{const r=await fetch(f.action,{method:"POST",body:new FormData(f),headers:{Accept:"application/json"}});
  if(r.ok){f.reset();s.textContent="Thank you, your RSVP has been sent."}else throw 0}
 catch(x){s.textContent="Your RSVP didn’t send. Please try again, or contact us directly."}});
</script></body></html>
